name: CI Workflow for MLflow Project

on:
  push:
    branches:
      - main

# Memperbaiki peringatan Node.js 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: python --version

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn mlflow==2.19.0

      - name: Run mlflow project
        run: |
          cd MLProject
          # Menambahkan --env-manager local agar MLflow tidak mencari program Conda
          mlflow run . --env-manager local

      - name: Get latest MLflow run_id
        id: get_run_id
        run: |
          cd MLProject
          RUN_ID=$(ls mlruns/0/ | grep -v meta.yaml | head -n 1)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Install Python dependencies (Waitress)
        run: pip install waitress

      - name: Upload to GitHub (Artefak)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifact
          path: MLProject/mlruns/0/${{ env.RUN_ID }}/artifacts/model/

      - name: Build Docker Model
        run: |
          cd MLProject
          mlflow models build-docker \
            -m "mlruns/0/${{ env.RUN_ID }}/artifacts/model" \
            -n "${{ secrets.DOCKER_USERNAME }}/banknote-model:latest" \
            --env-manager local

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/banknote-model:latest
